[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "megumin-companion-ai"
version = "0.1.0"
description = "A private Windows desktop companion AI prototype."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6,<7",
    "sounddevice>=0.5,<1",
    "uvicorn>=0.30,<1",
    "websockets>=15,<17",
]

[project.optional-dependencies]
perception = [
    "onnxruntime>=1.20,<2",
    "pillow>=11,<13",
    "rapidocr>=3.4,<4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.130,<7",
    "httpx2>=2.5,<3",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["app", "tests"]
