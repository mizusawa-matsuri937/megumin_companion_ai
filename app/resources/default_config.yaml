schema_version: 1

app:
  name: Megumin Desktop Companion AI
  environment: dev
  timezone: Asia/Shanghai
  language: zh-CN
  log_level: INFO

# W15: 开机启动默认关闭；启用时只使用当前用户的 Run 注册表项，绝不创建提权计划任务。
desktop:
  startup_enabled: false

server:
  host: 127.0.0.1
  port: 8765

logging:
  console_enabled: true
  file_enabled: true
  file_path: app.jsonl
  max_bytes: 10485760
  file_count: 5
  retention_days: 14

# 默认使用不联网的确定性 Mock；切换到真实 provider 时才要求专用密钥和 model。
llm:
  provider: mock
  api_key_env: COMPANION_LLM_API_KEY
  base_url: https://api.openai.com
  endpoint: /v1/chat/completions
  model: ""
  timeout_seconds: 45
  temperature: 0.8
  max_tokens: 600
  # OpenAI Chat Completions 默认必须同时观察 finish_reason=stop 和 [DONE]。
  stream_completion_mode: done_and_finish_reason
  transport:
    # 不继承 HTTP_PROXY/HTTPS_PROXY；企业代理必须在这里显式配置且不得含 URL 凭据。
    proxy_url: null
    # 相对路径位于受管 config 目录；绝对企业 CA 路径也必须显式提供。
    ca_bundle_path: null

# 默认仍为离线 Mock。启用 GPT-SoVITS 时必须显式配置本机 /tts 地址和 preset。
tts:
  provider: mock
  base_url: http://127.0.0.1:9880
  output_directory: tts/gpt-sovits/ephemeral
  connect_timeout_seconds: 8
  first_byte_timeout_seconds: 8
  # 保留的兼容字段现在只表示单个 TTS job 的总 deadline。
  timeout_seconds: 30
  cancellation_timeout_seconds: 1
  max_audio_bytes: 33554432
  default_preset: default
  presets: {}
  # preset.ref_audio_scope=local_file 仅用于同机 loopback 服务且会检查本机文件；
  # service_resource（默认）是由 GPT-SoVITS 服务解释的远端/容器内资源，不做本机路径假设。
  # 持久缓存涉及对话文本派生音频，默认关闭；启用后仍会跳过敏感文本。
  cache_enabled: false
  cache_directory: tts/gpt-sovits/persistent
  cache_max_bytes: 536870912
  cache_ttl_seconds: 604800
  transport:
    proxy_url: null
    ca_bundle_path: null

# 默认禁用；首次启用真实 VTS 时仍需用户在 VTube Studio 内人工 Allow。
vts:
  enabled: false
  uri: ws://127.0.0.1:8001
  plugin_name: Megumin Companion
  plugin_developer: Local User
  token_path: vts-token.json
  request_timeout_seconds: 5
  queue_capacity: 16
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  expression_hotkeys: {}
  transport:
    proxy_url: null
    ca_bundle_path: null

# W28：默认没有任何私人模型、动作或 Expression 名称。VTS 开启后可先使用
# 标准输入参数；主体动作和自动红眼只有在用户私有设置中补齐语义名称后才可用。
avatar:
  enabled: true
  parameter_control_enabled: true
  micro_motion_enabled: true
  lip_sync_enabled: true
  body_motion_enabled: true
  auto_red_eye_enabled: true
  tick_hz: 25
  keepalive_seconds: 0.5
  urgent_queue_capacity: 32
  playback_chunk_ms: 30
  mouth_noise_floor: 0.02
  mouth_gain: 4
  mouth_attack_seconds: 0.04
  mouth_release_seconds: 0.12
  head_amplitude_degrees: 2
  gaze_amplitude: 0.18
  breathing_amplitude: 0.03
  red_eye_duration_seconds: 2
  red_eye_fade_seconds: 0.1
  release_hotkey_name: ""
  red_eye_hotkey_name: ""
  red_eye_expression_file: ""
  body_motion_hotkeys: {}
  model_motion_hotkeys: {}

emotion:
  enabled: true
  max_delta_per_event: 0.15
  max_delta_per_minute: 0.25
  label_min_duration_seconds: 15
  explosion_cooldown_seconds: 300
  expression_cooldown_seconds: 4

storage:
  enabled: true
  database_path: companion.sqlite3
  busy_timeout_ms: 5000

memory:
  history_retention_days: 7
  confirmation_ttl_minutes: 15
  # 真实 LLM 的结构化候选分析需另行显式开启；长期记忆 feature 本身仍默认关闭。
  candidate_analysis_enabled: false

perception:
  operation_timeout_seconds: 10
  # Only a freshly privacy-reviewed text summary may be attached to an opted-in chat turn.
  prompt_context_max_age_seconds: 30
  max_frame_bytes: 20971520
  minimum_hash_distance: 0.08
  max_tracked_windows: 128
  ocr_max_spans: 2000
  ocr_max_span_chars: 2000
  max_ocr_text_chars: 100000
  max_summary_chars: 2000
  cloud_max_calls: 6
  cloud_period_seconds: 60

proactive:
  minimum_score: 0.62
  cooldown_seconds: 1200
  idle_minimum_seconds: 180
  perception_max_age_seconds: 30
  daily_limit: 8
  quiet_start_hour: 23
  quiet_end_hour: 8

# 默认禁用，且不会下载模型或请求麦克风权限。用户可在设置中显式安装受管中文离线 STT，
# 或继续配置自己的 whisper-cli 与模型。
stt:
  enabled: false
  provider: whisper_cpp
  # 只接受内置受管 Whisper 配置档；未来更大模型会以独立配置档登记，
  # 继续固定 runtime/model 来源、版本、大小和 SHA-256。
  managed_profile: whispercpp_base_q5_1
  executable: stt/whispercpp/v1.9.1/bin/whisper-cli.exe
  model_path: stt/whispercpp/v1.9.1/model/ggml-base-q5_1.bin
  language: zh
  threads: null
  temporary_directory: stt
  terminate_grace_seconds: 0.5
  max_audio_bytes: 67108864
  max_output_bytes: 2097152
  max_recording_seconds: 120
  transcription_timeout_seconds: 60
  device: null
  blocksize: 0

pipeline:
  tts_worker_count: 2
  segment_min_chars: 6
  segment_max_chars: 42
  segment_max_words: 25
  mock_token_delay_ms: 20
  mock_audio_duration_ms: 180
  mock_audio_volume: 0.12
  audio_cache_path: mock
  # 默认静默，避免后端启动后意外发声；Gate A 人工工具显式使用受监管的 MediaWorker。
  playback_mode: silent
  # W17：仅保存 MediaWorker 枚举产生的稳定设备标识；null 表示系统默认输出。
  output_device_id: null

# W07 集中硬上限；provider/功能配置只允许低于这些值，不能绕过。
limits:
  version: 1
  dev_http_body_bytes: 65536
  dev_websocket_frame_bytes: 65536
  metadata_bytes: 8192
  metadata_keys: 16
  metadata_depth: 3
  metadata_nodes: 128
  provider_output_tokens: 4096
  prompt_total_tokens: 16384
  prompt_system_tokens: 4096
  prompt_current_tokens: 8192
  prompt_history_tokens: 4096
  prompt_memory_tokens: 2048
  prompt_screen_tokens: 1024
  prompt_block_tokens: 512
  llm_output_bytes: 65536
  llm_output_segments: 128
  tts_queue_capacity: 8
  ready_audio_queue_capacity: 4
  audio_single_result_bytes: 33554432
  audio_inflight_bytes: 67108864
  audio_total_duration_ms: 120000
