name: cross-platform quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/windows-development-baseline
      - "codex/**"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Tests and branch coverage
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict mypy
        run: uv run mypy

  installed-wheel:
    env:
      # On pull_request, GITHUB_SHA identifies the tested merge result while
      # this value identifies the contributor branch head.
      W05_CHANGE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: "3.11"
          version: "0.11.28"
      - name: Build wheel
        run: uv build --wheel --out-dir dist/w05-wheel
      - name: Inspect, install, and smoke wheel outside the repository
        run: >-
          uv run --no-project --python 3.11 python tools/w05_ci_smoke.py
          --wheel-dir dist/w05-wheel
          --source-root .
          --lock-file uv.lock
          --evidence dist/w05-evidence/provenance.json
      # Only the path-free provenance is retained. The wheel and uv cache are
      # deliberately neither uploaded nor promoted as release artifacts.
      - name: Upload non-release provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w05-provenance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/w05-evidence/provenance.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
