app:
  name: Megumin Desktop Companion AI
  environment: dev
  timezone: Asia/Shanghai
  language: zh-CN
  log_level: INFO

server:
  host: 127.0.0.1
  port: 8765

logging:
  console_enabled: true
  file_enabled: true
  file_path: data/logs/app.jsonl

# Day 5-7 默认使用不联网的确定性 Mock。Day 10 改为真实 provider 后才要求密钥。
llm:
  provider: mock
  api_key_env: COMPANION_LLM_API_KEY
  base_url: https://api.openai.com
  endpoint: /v1/chat/completions
  model: ""
  timeout_seconds: 45
  temperature: 0.8
  max_tokens: 600

# 默认仍为离线 Mock。启用 GPT-SoVITS 时必须显式配置本机 /tts 地址和 preset。
tts:
  provider: mock
  base_url: http://127.0.0.1:9880
  output_directory: data/cache/audio/gpt-sovits/ephemeral
  timeout_seconds: 30
  max_audio_bytes: 33554432
  default_preset: default
  presets: {}
  # 持久缓存涉及对话文本派生音频，默认关闭；启用后仍会跳过敏感文本。
  cache_enabled: false
  cache_directory: data/cache/audio/gpt-sovits/persistent
  cache_max_bytes: 536870912
  cache_ttl_seconds: 604800

pipeline:
  tts_worker_count: 2
  segment_min_chars: 6
  segment_max_chars: 42
  segment_max_words: 25
  mock_token_delay_ms: 20
  mock_audio_duration_ms: 180
  mock_audio_volume: 0.12
  audio_cache_path: data/cache/audio/mock
  # 默认静默模拟播放，避免后端启动后意外发声；Gate A 人工工具显式使用系统播放器。
  playback_mode: silent
