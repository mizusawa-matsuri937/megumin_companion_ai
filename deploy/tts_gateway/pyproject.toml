[project]
name = "megumin-tts-gateway-runtime"
version = "0.1.0"
description = "Locked inference-only runtime for the local GPT-SoVITS gateway."
requires-python = "==3.11.*"
dependencies = [
    "cn2an==0.5.23",
    "fast-langdetect==0.3.2",
    "fastapi==0.115.8",
    "ffmpeg-python==0.2.0",
    "imageio-ffmpeg==0.6.0",
    "jieba==0.42.1",
    "jieba-fast==0.53",
    "librosa==0.10.2",
    "matplotlib==3.11.1",
    "numba==0.60.0",
    "numpy==1.26.4",
    "onnxruntime==1.20.1",
    "opencc==1.1.9",
    "peft==0.15.2",
    "pydantic==2.10.6",
    "pyopenjtalk==0.4.1",
    "pypinyin==0.53.0",
    "pytorch-lightning==2.5.1",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "scipy==1.15.1",
    "sentencepiece==0.2.0",
    "split-lang>=2.1,<3",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchmetrics==1.5.2",
    "tqdm==4.67.1",
    "transformers==4.50.0",
    "uvicorn==0.34.0",
    "x-transformers>=2.1,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
